
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>One Bus Details</title>
</head>
<body>

    <h2>Details of One Bus</h2>

    <label>Bus ID:</label>
    <input type="number" id="bus_id" placeholder="Enter Bus ID">
    <br><br>

    <button onclick="getBus()">View Bus Details</button>

    <br><br>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Bus ID</th>
                <th>Bus No</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Departure Time</th>
                <th>Total Seats</th>
            </tr>
        </thead>

        <tbody id="busTable"></tbody>
    </table>

    <p id="result"></p>

    <script>
        function getBus() {
            const bus_id = document.getElementById("bus_id").value;

            if (bus_id === "") {
                alert("Please enter Bus ID");
                return;
            }

            fetch("/buses/" + bus_id)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch bus details");
                }
                return response.json();
            })
            .then(data => {
                const table = document.getElementById("busTable");
                table.innerHTML = "";

                if (data.length === 0) {
                    document.getElementById("result").innerHTML =
                        "Bus NOT found";
                    return;
                }

                data.forEach(bus => {
                    const row = `
                        <tr>
                            <td>${bus.bus_id}</td>
                            <td>${bus.bus_no}</td>
                            <td>${bus.source}</td>
                            <td>${bus.destination}</td>
                            <td>${bus.departure_time}</td>
                            <td>${bus.total_seats}</td>
                        </tr>
                    `;

                    table.innerHTML += row;
                });

                document.getElementById("result").innerHTML = "";
            })
            .catch(error => {
                document.getElementById("result").innerHTML =
                    error.message;
            });
        }
    </script>

</body>
</html>
